; Standalone Bluetooth meter datalogger. Always select the matching board target.

[platformio]
default_envs = ut_meter_jc3248w535

[env:native]
test_ignore = test_meter_value_persistence
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -Wall -Wextra

[ut_meter]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4 -DCONFIG_BT_NIMBLE_MAX_BONDS=4
extra_scripts = pre:tools/esp32/meter_board_build.py
board_build.flash_mode = qio
board_build.psram_type = opi
build_src_filter = +<esp32_touch/meter/> +<esp32_touch/panel.cpp>
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    adafruit/Adafruit GFX Library@1.11.11
    h2zero/NimBLE-Arduino@1.4.3
    bblanchon/ArduinoJson@7.4.2
    moononournation/GFX Library for Arduino@1.6.0
    lewisxhe/SensorLib@0.5.1

[env:ut_meter_jc3248w535]
extends = ut_meter
custom_meter_board_profile = boards/meter/jc3248w535.json

[env:ut_meter_amoled175]
extends = ut_meter
custom_meter_board_profile = boards/meter/amoled175.json

[env:ut_meter_lcd147]
extends = ut_meter
custom_meter_board_profile = boards/meter/lcd147.json

[env:ut_meter_mapped]
extends = ut_meter
